name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install buildozer cython
      - run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
